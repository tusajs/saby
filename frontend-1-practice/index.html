<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Выбор даты и времени · ÉLAIRE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header"><strong class="brand">ÉLAIRE</strong><span>Онлайн-запись</span></header>
  <main>
    <p class="step">Онлайн-запись · Шаг 3 из 5</p>
    <h1>Выбор даты и времени</h1>
    <div class="schedule">
      <section class="calendar" aria-label="Календарь на ноябрь 2026">
        <h2>Ноябрь 2026</h2>
        <div class="week" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div class="days">
          <button class="day" disabled aria-label="1 ноября">1</button>
          <button class="day" disabled aria-label="2 ноября">2</button>
          <button class="day" disabled aria-label="3 ноября">3</button>
          <button class="day" disabled aria-label="4 ноября">4</button>
          <button class="day" disabled aria-label="5 ноября">5</button>
          <button class="day" disabled aria-label="6 ноября">6</button>
          <button class="day" disabled aria-label="7 ноября">7</button>
          <button class="day" disabled aria-label="8 ноября">8</button>
          <button class="day" disabled aria-label="9 ноября">9</button>
          <button class="day" disabled aria-label="10 ноября">10</button>
          <button class="day" disabled aria-label="11 ноября">11</button>
          <button class="day" disabled aria-label="12 ноября">12</button>
          <button class="day" disabled aria-label="13 ноября">13</button>
          <button class="day" disabled aria-label="14 ноября">14</button>
          <button class="day" disabled aria-label="15 ноября">15</button>
          <button class="day" disabled aria-label="16 ноября">16</button>
          <button class="day" disabled aria-label="17 ноября">17</button>
          <button class="day" disabled aria-label="18 ноября">18</button>
          <button class="day" disabled aria-label="19 ноября">19</button>
          <button class="day" disabled aria-label="20 ноября">20</button>
          <button class="day" disabled aria-label="21 ноября">21</button>
          <button class="day" disabled aria-label="22 ноября">22</button>
          <button class="day selected" aria-label="23 ноября">23</button>
          <button class="day" aria-label="24 ноября">24</button>
          <button class="day" aria-label="25 ноября">25</button>
          <button class="day" aria-label="26 ноября">26</button>
          <button class="day" aria-label="27 ноября">27</button>
          <button class="day" aria-label="28 ноября">28</button>
          <button class="day" aria-label="29 ноября">29</button>
          <button class="day" aria-label="30 ноября">30</button>
        </div>
      </section>
      <section class="times"><h2>Время визита</h2><p>23 ноября</p>
        <div class="slots"><button class="slot">09:00</button><button class="slot" disabled>10:30</button><button class="slot selected">12:00</button><button class="slot">13:30</button><button class="slot">15:00</button><button class="slot" disabled>16:30</button></div>
      </section>
    </div>
    <div class="summary"><div><small>Ваш выбор</small><strong>23 ноября 2026 · 12:00</strong></div><button class="next">Далее</button></div>
  </main>
  <footer class="footer"><span>ÉLAIRE · Москва, ул. Пречистенка, 12</span><span>Ежедневно 10:00–22:00</span></footer>
</body>
</html>
